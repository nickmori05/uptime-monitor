services:
  monitor:
    command: ["watch", "--interval", "3600"]
  fixture:
    image: ${MONITOR_IMAGE:-uptime-monitor:local}
    entrypoint: ["python", "/fixture.py"]
    volumes:
      - ./tests/fixture_server.py:/fixture.py:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 20

networks:
  default:
    internal: true
