services:
  monitor:
    build: .
    image: ${MONITOR_IMAGE:-uptime-monitor:local}
    init: true
    command: ["watch", "--interval", "30"]
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s

volumes:
  monitor-data:
