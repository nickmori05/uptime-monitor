services:
  monitor:
    build: .
    image: ${MONITOR_IMAGE:-uptime-monitor:local}
    init: true
    command: ["watch", "--interval", "30", "--deadline", "20"]
    volumes:
      - monitor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD", "python", "monitor.py", "--database", "/data/checks.sqlite3", "health"]
      interval: 15s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  monitor-data:
